<!doctype html>
<!--
  The SWU Scan Card source's page (src/plugin-main.c, docs/obs-integration.md): the art, name, subtitle and
  printing. The prices have their own source (prices.html). Bundled with the plugin and loaded into a
  private browser source. Offline by design: no fonts, scripts or images from the network; the art
  arrives as base64 in the event. The source's properties arrive as custom properties in the CSS the
  plugin generates: options, never free-form CSS, so the "Identified by SWU Scan" badge can't be restyled away.

  Events (dispatched by obs-browser's emit_event): "swuscanCard" with the show_card body plus "seq",
  and "swuscanClear". A re-send of the card already shown (same seq) is ignored.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="overlay.css">
<style>
  :root { --show-art: 1; --show-subtitle: 1; --show-printing: 1; }
  #card { display: flex; gap: calc(var(--u) * 3); align-items: stretch; }
  body.vertical #card { flex-direction: column; }
  #art { flex: 0 0 auto; height: 100%; border-radius: calc(var(--u) * 1.5); object-fit: contain; max-width: 45%; }
  body.vertical #art { height: auto; width: 100%; max-width: 100%; max-height: 70%; }
  .none { display: none; }
  #text { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #name { font-size: calc(var(--u) * 11); font-weight: 700; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #subtitle { font-size: calc(var(--u) * 6.5); margin-top: calc(var(--u) * 1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #printing { font-size: calc(var(--u) * 5.5); margin-top: calc(var(--u) * 2); letter-spacing: .05em; }
</style>
</head>
<body>
<div id="card" class="panel">
  <img id="art" class="none" alt="">
  <div id="text">
    <div id="name"></div>
    <div id="subtitle" class="muted"></div>
    <div id="printing" class="muted"></div>
  </div>
  <div id="badge"><img src="logo.svg" alt="">Identified by SWU Scan</div>
</div>
<script>
  "use strict";
  const card = document.getElementById("card");
  const art = document.getElementById("art");
  let shownSeq = null;

  const option = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim() === "1";

  function line(id, value, shown) {
    const el = document.getElementById(id);
    el.textContent = value || "";
    el.classList.toggle("none", !shown);
  }

  function show(c) {
    if (!c || c.seq === shownSeq) return;          // a re-send of what's already up
    shownSeq = c.seq;
    document.body.classList.toggle("vertical", option("--vertical"));
    line("name", c.name, true);
    line("subtitle", c.subtitle, option("--show-subtitle"));
    line("printing", c.printing, option("--show-printing"));
    if (option("--show-art") && c.art && c.art.base64) {
      art.src = "data:" + (c.art.mime || "image/jpeg") + ";base64," + c.art.base64;
      art.classList.remove("none");
    } else {
      art.removeAttribute("src");
      art.classList.add("none");
    }
    card.classList.remove("on");
    void card.offsetWidth;                          // restart the entrance transition
    card.classList.add("on");
  }

  window.addEventListener("swuscanCard", e => show(e.detail));
  window.addEventListener("swuscanClear", () => { shownSeq = null; card.classList.remove("on"); });
</script>
</body>
</html>
