name: Tests
# Player-side routing (src/side-routing.h, plain C) and the card and prices pages' side rules in Chromium
# (tools/check_pages.mjs). Neither needs OBS; tools/obs_check.py --sides checks a real OBS by hand.
on:
  workflow_dispatch:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
permissions:
  contents: read
jobs:
  routing:
    name: Side routing (C)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc tests/side-routing-test.c -o side-routing-test
          ./side-routing-test
  pages:
    name: Pages (Chromium)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Check the pages
        run: node tools/check_pages.mjs
